camera:
{
    resolution = { width = 400; height = 300; };
    position = { x = 0; y = 0; z = 0; };
    rotation = { x = 0; y = 0; z = 0; };
    fieldOfView = 72;
};

primitives:
{
    // Basic shapes - all positioned in front of camera (negative Z)
    spheres = (
        { x = 0; y = 0; z = -8; r = 2; color = { r = 255; g = 50; b = 50; }; mat = "F"; }
    );

    // Cylinder to the left
    cylinders = (
        { x = -5; y = 0; z = -8; sx = 1; sy = 1; sz = 3; color = { r = 50; g = 255; b = 50; }; mat = "F"; }
    );

    // Cone to the right
    cones = (
        { x = 5; y = 0; z = -8; sx = 1.5; sy = 1.5; sz = 3; color = { r = 50; g = 50; b = 255; }; mat = "F"; }
    );

    // Pyramid behind sphere
    pyramids = (
        { x = 0; y = 0; z = -15; sx = 4; sy = 4; sz = 4; color = { r = 255; g = 255; b = 50; }; mat = "F"; }
    );

    // Tetrahedron
    tetrahedrons = (
        { x = -8; y = 2; z = -12; sx = 2; sy = 2; sz = 2; color = { r = 255; g = 128; b = 0; }; mat = "F"; }
    );

    // Octahedron
    octahedrons = (
        { x = 8; y = 2; z = -12; sx = 2; sy = 2; sz = 2; color = { r = 0; g = 255; b = 128; }; mat = "M"; }
    );

    // Torus (donut)
    toruses = (
        { x = 0; y = 4; z = -10; sx = 1.5; sy = 0.4; sz = 0; color = { r = 255; g = 0; b = 255; }; mat = "F"; }
    );

    // Ground plane
    planes = (
        { axis = "Z"; position = -3; color = { r = 100; g = 100; b = 100; }; mat = "F"; }
    );
};

lights:
{
    ambient = 0.4;
    diffuse = 0.6;

    point = (
        { x = 200; y = 200; z = 200; }
    );
    directional = ( );
}
